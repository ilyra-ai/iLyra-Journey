# Lyra-MetaCare | MySQL 9.7.2 LTS
#
# Fonte única de configuração: .env.local, gerado por `pnpm env:init`.
# Sempre executar com:
#   docker compose --env-file .env.local <comando>
#
# As variáveis MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD e
# MYSQL_ROOT_PASSWORD precisam existir e não podem estar vazias.
#
# ATENÇÃO: as variáveis de inicialização da imagem MySQL só criam
# banco, usuário e permissões quando o diretório de dados está vazio.
# Se o volume já estiver inicializado, editar o .env.local NÃO
# altera automaticamente as credenciais existentes.

services:
  mysql:
    image: mysql:9.7.2
    container_name: lyra-metacare-mysql
    restart: unless-stopped

    # Configuração compatível com a aplicação Lyra-MetaCare.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?defina MYSQL_DATABASE no .env.local}
      MYSQL_USER: ${MYSQL_USER:?defina MYSQL_USER no .env.local}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD no .env.local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env.local}

    # Acesso apenas pelo computador local (porta externa configurável).
    ports:
      - '127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306'

    # Preserva os dados durante reinicializações e atualizações de contêiner.
    volumes:
      - mysql_data:/var/lib/mysql

    # Permite desligamento ordenado do MySQL.
    stop_grace_period: 60s

    healthcheck:
      # Consulta SQL real via TCP, usando as credenciais da aplicação.
      # O servidor só estará saudável se o banco existir e o usuário
      # conseguir se autenticar e executar SELECT 1.
      # O duplo cifrão ($$) preserva as variáveis para o shell do contêiner.
      # As mensagens de erro do cliente são mantidas para diagnóstico
      # por `docker inspect ... .State.Health`.
      test:
        - CMD-SHELL
        - |
          if [ -z "$$MYSQL_USER" ] || [ -z "$$MYSQL_PASSWORD" ] || [ -z "$$MYSQL_DATABASE" ]; then
            echo 'Healthcheck MySQL: variáveis MYSQL_USER, MYSQL_PASSWORD ou MYSQL_DATABASE ausentes.' >&2
            exit 1
          fi
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --no-defaults --no-login-paths \
            --protocol=TCP \
            --host=127.0.0.1 \
            --port=3306 \
            --connect-timeout=5 \
            --get-server-public-key \
            --user="$$MYSQL_USER" \
            --database="$$MYSQL_DATABASE" \
            --batch \
            --skip-column-names \
            --execute='SELECT 1' > /dev/null
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 120s
      start_interval: 5s

  falkordb:
    image: falkordb/falkordb-server:6.0.2
    restart: unless-stopped
    environment:
      REDIS_ARGS: '--appendonly yes --requirepass ${LYRA_MEMORIA_BANCO_SENHA:?gere os segredos com pnpm env:init}'
      REDISCLI_AUTH: ${LYRA_MEMORIA_BANCO_SENHA:?gere os segredos com pnpm env:init}
    volumes:
      - memoria_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

  memoria:
    build:
      context: ./services/memoria
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      LYRA_MEMORIA_SEGREDO: ${LYRA_MEMORIA_SEGREDO:?gere os segredos com pnpm env:init}
      LYRA_MEMORIA_BANCO_SENHA: ${LYRA_MEMORIA_BANCO_SENHA:?gere os segredos com pnpm env:init}
      LYRA_MEMORIA_APP_URL: ${LYRA_MEMORIA_APP_URL:-http://host.docker.internal:3000}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:${LYRA_MEMORIA_PORTA:-8019}:8000'
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/saude', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

volumes:
  mysql_data:
  memoria_data:
